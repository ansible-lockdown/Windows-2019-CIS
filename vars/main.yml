---

# vars file for Windows-2019-CIS

# min_ansible_version is the base version of Ansible to use. This ensures compatibility and avoids execution
# errors due to missing features or incompatible syntax in earlier versions of Ansible.
min_ansible_version: "2.16.1"

# Used to control warning summary
warn_control_list: ""
warn_count: 0

# lockdown_banner sets the variable that is created for the banner.
lockdown_banner: "{{ lookup('file', './templates/banner.txt') }}"

# These are default values that will be changed when the prelim
# runs and finds the correct setting.
prelim_win19cis_is_standalone: false
prelim_win19cis_is_domain_controller: false
prelim_win19cis_is_domain_member: false

# Account Policy (CIS section 1) is domain scoped on any domain joined host: the
# Default Domain Policy overwrites local [System Access] at every refresh, so the
# ten secedit backed controls in section 1 cannot hold locally there. Seeded false
# so a standalone host still applies them; the prelim sets it true when joined.
prelim_win19cis_account_policy_is_domain_scoped: false

# Read from secedit in section_1/section_1.2.x.yml, after 1.2.2 has enabled lockout. Windows
# rejects a LockoutDuration lower than the current ResetLockoutCount, so 1.2.1 needs the pair
# as it stands at that point, not as it stood before the role touched it.
discovered_win19cis_current_lockout_duration: 0
discovered_win19cis_current_lockout_reset: 0

# Default setting, this should not be changed
# and is overridden if a task that changed sets the value if required.
reboot_host: false
