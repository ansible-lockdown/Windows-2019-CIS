---

- name: "5.1 | PATCH | Ensure Print Spooler (Spooler) is set to Disabled DC only | Domain Controller"
  when:
    - win19cis_rule_5_1
    - prelim_win19cis_is_domain_controller
  tags:
    - level1-domaincontroller
    - rule_5.1
    - patch
    - printer
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  notify: Change_Requires_Reboot
  block:
    - name: "5.1 | PATCH | Ensure Print Spooler (Spooler) is set to Disabled DC only | Domain Controller | Check to see if Spooler service exists"
      ansible.windows.win_service_info:
        name: Spooler
      check_mode: false
      register: discovered_5_1_spooler_service_info

    - name: "5.1 | PATCH | Ensure Print Spooler (Spooler) is set to Disabled DC only | Domain Controller | RegEdit"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Spooler
        name: Start
        data: 4
        type: dword

    - name: "5.1 | PATCH | Ensure Print Spooler (Spooler) is set to Disabled DC only | Domain Controller | Service"
      when: discovered_5_1_spooler_service_info.exists
      ansible.windows.win_service:
        name: Spooler
        start_mode: disabled
        state: stopped

- name: "5.2 | PATCH | Ensure Print Spooler (Spooler) is set to Disabled MS only | Member Server"
  when:
