- name: "2.2.31 | PATCH | Ensure Generate security audits is set to LOCAL SERVICE, NETWORK SERVICE"
  when: win19cis_rule_2_2_31
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_2.2.31
    - patch
    - userrights
    - services
    - NIST800-171_3.1.1
    - NIST800-171_3.1.5
    - NIST800-171_3.3.8
    - NIST800-171_3.3.9
    - NIST800-53R5_AC-2
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-6
    - NIST800-53R5_AC-6_1
    - NIST800-53R5_AC-6_7
    - NIST800-53R5_AU-9_4
  block:
    - name: "2.2.31 | AUDIT | Read current Generate security audits holders"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        # Cmdlets, operators and $Matches only - no .NET method calls - so this still
        # runs where PowerShell is in Constrained Language Mode. secedit must write to
        # a path that does not already exist: exporting USER_RIGHTS over an existing
        # file drops the [Unicode] header, after which Get-Content reads the UTF-16
        # export as single-byte characters and no line ever matches. secedit still
        # exits 0, so the read would silently return nothing.
        $cfg = Join-Path $env:TEMP "cis_userrights_$PID.inf"
        Remove-Item -LiteralPath $cfg -Force -ErrorAction SilentlyContinue
        secedit /export /areas USER_RIGHTS /cfg $cfg /quiet | Out-Null
        $holders = ''
        foreach ($line in Get-Content -LiteralPath $cfg) {
          if ($line -match '^SeAuditPrivilege\s*=\s*(.+)$') { $holders = $Matches[1] }
        }
        Remove-Item -LiteralPath $cfg -Force -ErrorAction SilentlyContinue
        if ($holders) {
          (($holders -split ',') | ForEach-Object { $_.TrimStart('*').Trim() } | Sort-Object) -join ','
        } else {
          ''
        }
      changed_when: false
      check_mode: false
      register: discovered_2_2_31_current

    - name: "2.2.31 | PATCH | Set Generate security audits to LOCAL SERVICE, NETWORK SERVICE"
      when: discovered_2_2_31_current.stdout | trim != 'S-1-5-19,S-1-5-20'
      ansible.windows.win_user_right:
        name: SeAuditPrivilege
        users:
          - LOCAL SERVICE
          - NETWORK SERVICE
        action: set

