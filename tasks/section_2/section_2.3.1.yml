---

- name: "2.3.1.1 | PATCH | Ensure Accounts Guest account status is set to Disabled MS only | Member Server"
  when:
    - win19cis_rule_2_3_1_1
    - not prelim_win19cis_is_domain_controller
  tags:
    - level1-memberserver
    - rule_2.3.1.1
    - patch
    - securitypolicy
    - NIST800-171_3.5.2
    - NIST800-53R5_IA-5
  community.windows.win_security_policy:
    section: System Access
    key: EnableGuestAccount
    value: 0

- name: "2.3.1.2 | PATCH | Ensure Accounts Limit local account use of blank passwords to console logon only is set to Enabled"
  when: win19cis_rule_2_3_1_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_2.3.1.2
    - patch
    - account
    - NIST800-171_3.5.2
    - NIST800-53R5_IA-5_1
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: LimitBlankPasswordUse
    data: 1
    type: dword

- name: "2.3.1.3 | PATCH | Configure Accounts Rename administrator account"
  when:
    - win19cis_rule_2_3_1_3
    - not (win_skip_for_test | bool)
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_2.3.1.3
    - patch
    - securitypolicy
    - NIST800-171_3.5.2
    - NIST800-53R5_IA-5
  block:
    - name: "2.3.1.3 | PATCH | Configure Accounts Rename administrator account | Make Changes To Admin Name"
      when: "'adminchangethis' not in win19cis_admin_username"
      community.windows.win_security_policy:
        section: System Access
        key: newadministratorname
        value: "{{ win19cis_admin_username }}"

    - name: "2.3.1.3 | AUDIT | Configure Accounts Rename administrator account | Warning Msg For Default Variable Not Edited"
      when: "'adminchangethis' in win19cis_admin_username"
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not changed the default admin username in win19cis_admin_username please"
          - "make the necessary change to the variable to be in compliance."

    - name: "2.3.1.3 | AUDIT | Configure Accounts Rename administrator account | Add Warn Count"
      when: "'adminchangethis' in win19cis_admin_username"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '2.3.1.3'

- name: "2.3.1.4 | PATCH | Configure Accounts Rename guest account"
  when: win19cis_rule_2_3_1_4
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_2.3.1.4
    - patch
    - securitypolicy
    - NIST800-171_3.5.2
    - NIST800-53R5_IA-5
  block:
    - name: "2.3.1.4 | PATCH | Configure Accounts Rename guest account | Make Changes To Guest Name"
      when: "'guestchangethis' not in win19cis_guest_username"
      community.windows.win_security_policy:
        section: System Access
        key: NewGuestName
        value: "{{ win19cis_guest_username }}"

    - name: "2.3.1.4 | AUDIT | Configure Accounts Rename guest account | Warning Msg For Default Variable Not Edited"
      when: "'guestchangethis' in win19cis_guest_username"
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not changed the default guest name in win19cis_guest_username please"
          - "make the necessary change to the variable to be in compliance."

    - name: "2.3.1.4 | AUDIT | Configure Accounts Rename guest account | Add Warn Count"
      when: "'guestchangethis' in win19cis_guest_username"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '2.3.1.4'
