- name: "18.10.57.3.10.1 | PATCH | Ensure 'Set time limit for active but idle Remote Desktop Services sessions' is set to 'Enabled: 15 minutes or less, but not Never (0)"
  when: win19cis_rule_18_10_57_3_10_1
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.57.3.10.1
    - patch
    - terminalservices
    - NIST800-171_3.1.10
    - NIST800-53R5_AC-11
  block:
    - name: "18.10.57.3.10.1 | PATCH | Ensure 'Set time limit for active but idle Remote Desktop Services sessions' is set to 'Enabled: 15 minutes or less, but not Never (0) | Set Variable"
      when:
        - win19cis_idle_rdp_session_disconnect_time > 0
        - win19cis_idle_rdp_session_disconnect_time <= 900000
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Nt\Terminal Services
        name: MaxIdleTime
        data: "{{ win19cis_idle_rdp_session_disconnect_time }}"
        type: dword

    - name: "18.10.57.3.10.1 | AUDIT | Ensure 'Set time limit for active but idle Remote Desktop Services sessions' is set to 'Enabled: 15 minutes or less, but not Never (0) | Warning Check For Variable Standards"
      when:
        - win19cis_idle_rdp_session_disconnect_time == 0 or
          win19cis_idle_rdp_session_disconnect_time > 900000
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid time set for win19cis_idle_rdp_session_disconnect_time. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "18.10.57.3.10.1 | AUDIT | Ensure 'Set time limit for active but idle Remote Desktop Services sessions' is set to 'Enabled: 15 minutes or less, but not Never (0) | Log a warning"
      when:
        - win19cis_idle_rdp_session_disconnect_time == 0 or
          win19cis_idle_rdp_session_disconnect_time > 900000
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.10.57.3.10.1'

