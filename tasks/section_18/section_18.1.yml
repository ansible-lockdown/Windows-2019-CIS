---

- name: "18.1.1.1 | PATCH | Ensure Prevent enabling lock screen camera is set to Enabled"
  when: win19cis_rule_18_1_1_1
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.1.1.1
    - patch
    - camera
    - NIST800-171_3.4.2
    - NIST800-53R5_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
    name: NoLockScreenCamera
    data: 1
    type: dword

- name: "18.1.1.2 | PATCH | Ensure Prevent enabling lock screen slide show is set to Enabled"
  when: win19cis_rule_18_1_1_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.1.1.2
    - patch
    - lockscreen
    - NIST800-171_3.4.2
    - NIST800-53R5_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
    name: NoLockScreenSlideshow
    data: 1
    type: dword

- name: "18.1.2.2 | PATCH | Ensure Allow users to enable online speech recognition services is set to Disabled"
  when: win19cis_rule_18_1_2_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.1.2.2
    - patch
    - onlinespeech
    - NIST800-171_3.4.1
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-171_3.13.1
    - NIST800-171_3.13.2
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_AC-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-7_1
    - NIST800-53R5_CM-9
    - NIST800-53R5_SA-3
    - NIST800-53R5_SA-8
    - NIST800-53R5_SA-10
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization
    name: AllowInputPersonalization
    data: 0
    type: dword

- name: "18.1.3 | PATCH | Ensure Allow Online Tips is set to Disabled"
  when: win19cis_rule_18_1_3
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.1.3
    - patch
    - onlinetips
    - NIST800-171_3.14.6
    - NIST800-171_3.14.7
    - NIST800-53R5_SI-4
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: AllowOnlineTips
    data: 0
    type: dword
