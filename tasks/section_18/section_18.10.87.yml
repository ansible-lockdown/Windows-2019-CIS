---

- name: "18.10.87.1 | PATCH | Ensure Turn on PowerShell Script Block Logging is set to Enabled"
  when: win19cis_rule_18_10_87_1
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.87.1
    - patch
    - powershell
    - NIST800-171_3.3.1
    - NIST800-171_3.3.2
    - NIST800-53R5_AU-2
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockLogging
    data: 1
    type: dword

- name: "18.10.87.2 | PATCH | Ensure Turn on PowerShell Transcription is set to Enabled"
  when: win19cis_rule_18_10_87_2
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.87.2
    - patch
    - powershell
    - NIST800-171_3.3.1
    - NIST800-171_3.3.2
    - NIST800-53R5_AU-2
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Powershell\Transcription
    name: EnableTranscripting
    data: 1
    type: dword
