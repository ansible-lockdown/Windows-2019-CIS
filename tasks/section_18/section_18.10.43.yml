- name: "18.10.43.11.1.1.1 | PATCH | Ensure Configure Brute-Force Protection aggressiveness is set to Enabled: Medium or higher"
  when: win19cis_rule_18_10_43_11_1_1_1
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.43.11.1.1.1
    - patch
    - defender
    - brute_force
    - NIST800-171_3.14.1
    - NIST800-171_3.14.5
    - NIST800-171_3.14.6
    - NIST800-53R5_AC-7
    - NIST800-53R5_SI-4
  block:
    - name: "18.10.43.11.1.1.1 | PATCH | Ensure Configure Brute-Force Protection aggressiveness is set to Enabled: Medium or higher | Set Registry"
      when: win19cis_brute_force_protection_aggressiveness == 1 or win19cis_brute_force_protection_aggressiveness == 2
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection
        name: BruteForceProtectionAggressiveness
        data: "{{ win19cis_brute_force_protection_aggressiveness }}"
        type: dword

    - name: "18.10.43.11.1.1.1 | AUDIT | Ensure Configure Brute-Force Protection aggressiveness is set to Medium or higher | Warning Check For Variable Standards"
      when:
        - win19cis_brute_force_protection_aggressiveness != 1
        - win19cis_brute_force_protection_aggressiveness != 2
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid setting for win19cis_brute_force_protection_aggressiveness. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "18.10.43.11.1.1.1 | AUDIT | Ensure Configure Brute-Force Protection aggressiveness is set to Medium or higher | Log a warning"
      when:
        - win19cis_brute_force_protection_aggressiveness != 1
        - win19cis_brute_force_protection_aggressiveness != 2
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.10.43.11.1.1.1'

- name: "18.10.43.11.1.1.2 | PATCH | Ensure Configure Remote Encryption Protection Mode is set to Enabled: Audit or higher"
  when: win19cis_rule_18_10_43_11_1_1_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.43.11.1.1.2
    - patch
    - defender
    - brute_force
    - NIST800-171_3.14.1
    - NIST800-171_3.14.5
    - NIST800-171_3.14.6
    - NIST800-53R5_AC-7
    - NIST800-53R5_SI-4
  block:
    - name: "18.10.43.11.1.1.2 | PATCH | Ensure Configure Remote Encryption Protection Mode is set to Enabled: Audit or higher | Set Registry Value"
      when:
        - win19cis_remote_encryption_protection_mode == 1 or
          win19cis_remote_encryption_protection_mode == 2
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection
        name: BruteForceProtectionConfiguredState
        data: "{{ win19cis_remote_encryption_protection_mode }}"
        type: dword

    - name: "18.10.43.11.1.1.2 | AUDIT | Ensure Configure Remote Encryption Protection Mode is set to Enabled: Audit or higher | Warning Check For Variable Standards"
      when:
        - win19cis_remote_encryption_protection_mode != 1
        - win19cis_remote_encryption_protection_mode != 2
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid setting for win19cis_remote_encryption_protection_mode. Please review"
          - "the variable and make the necessary change to bring it into compliance. Acceptable: 1 (Audit), 2 (Block)."

    - name: "18.10.43.11.1.1.2 | AUDIT | Ensure Configure Remote Encryption Protection Mode is set to Enabled: Audit or higher | Warning Logged"
      when:
        - win19cis_remote_encryption_protection_mode != 1
        - win19cis_remote_encryption_protection_mode != 2
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.10.43.11.1.1.2'

