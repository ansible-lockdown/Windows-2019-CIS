---

- name: "18.10.81.1 | PATCH | Ensure Allow user control over installs is set to Disabled"
  when: win19cis_rule_18_10_81_1
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.81.1
    - patch
    - NIST800-171_3.1.7
    - NIST800-53R5_AC-6_10
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
    name: EnableUserControl
    data: 0
    type: dword

- name: "18.10.81.2 | PATCH | Ensure 'Always install with elevated privileges' is set to 'Disabled'"
  when: win19cis_rule_18_10_81_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.81.2
    - patch
    - NIST800-171_3.1.1
    - NIST800-53R5_AC-2_9
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
    name: AlwaysInstallElevated
    data: 0
    type: dword

- name: "18.10.81.3 | PATCH | Ensure Prevent Internet Explorer security prompt for Windows Installer scripts is set to Disabled"
  when: win19cis_rule_18_10_81_3
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.81.3
    - patch
    - ie
    - NIST800-171_3.4.8
    - NIST800-53R5_CM-7_5
    - NIST800-53R5_CM-10
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
    name: SafeForScripting
    data: 0
    type: dword
