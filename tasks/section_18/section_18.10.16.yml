---

- name: "18.10.16.1 | PATCH | Ensure Allow Diagnostic Data is set to Enabled: Diagnostic data off (not recommended) or Enabled: Send required diagnostic data"
  when: win19cis_rule_18_10_16_1
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.16.1
    - automated
    - patch
    - diagnostics
    - NIST800-171_3.14.6
    - NIST800-171_3.14.7
    - NIST800-53R5_SI-4
  block:
    - name: "18.10.16.1 | PATCH | Ensure Allow Diagnostic Data is set to Enabled: Diagnostic data off (not recommended) or Enabled: Send required diagnostic data | Set Variable"
      when: win19cis_allow_telemetry == 0 or win19cis_allow_telemetry == 1
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name: AllowTelemetry
        data: "{{ win19cis_allow_telemetry }}"
        type: dword

    - name: "18.10.16.1 | AUDIT | Ensure Allow Diagnostic Data is set to Enabled: Diagnostic data off (not recommended) or Enabled: Send required diagnostic data | Warning Check For Variable Standards"
      when:
        - win19cis_allow_telemetry != 0
        - win19cis_allow_telemetry != 1
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid setting for win19cis_allow_telemetry. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "18.10.16.1 | AUDIT | Ensure Allow Diagnostic Data is set to Enabled: Diagnostic data off (not recommended) or Enabled: Send required diagnostic data | Log a warning"
      when:
        - win19cis_allow_telemetry != 0
        - win19cis_allow_telemetry != 1
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.10.16.1'

- name: "18.10.16.2 | PATCH | Ensure Configure Authenticated Proxy usage for the Connected User Experience and Telemetry service is set to Enabled: Disable Authenticated Proxy usage"
  when: win19cis_rule_18_10_16_2
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.16.2
    - patch
    - datacollection
    - NIST800-171_3.14.6
    - NIST800-171_3.14.7
    - NIST800-53R5_SI-4
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
    name: DisableEnterpriseAuthProxy
    data: 1
    type: dword

