- name: "18.5.9 | PATCH | Ensure MSS ScreenSaverGracePeriod The time in seconds before the screen saver grace period expires is set to Enabled 5 or fewer seconds"
  when: win19cis_rule_18_5_9
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.5.9
    - patch
    - mss
    - NIST800-171_3.1.1
    - NIST800-171_3.1.10
    - NIST800-171_3.1.11
    - NIST800-53R5_AC-2_5
    - NIST800-53R5_AC-11
    - NIST800-53R5_AC-11_1
    - NIST800-53R5_AC-12
  block:
    - name: "18.5.9 | PATCH | Ensure MSS ScreenSaverGracePeriod The time in seconds before the screen saver grace period expires is set to Enabled 5 or fewer seconds | Set ScreenSaverGracePeriod if time is 5 seconds or fewer"
      when: win19cis_screen_saver_grace_period <= 5
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows Nt\CurrentVersion\Winlogon
        name: ScreenSaverGracePeriod
        data: "{{ win19cis_screen_saver_grace_period }}"
        type: string

    - name: "18.5.9 | AUDIT | Ensure MSS ScreenSaverGracePeriod The time in seconds before the screen saver grace period expires is set to Enabled 5 or fewer seconds | Warn if ScreenSaverGracePeriod exceeds 5 seconds"
      when: win19cis_screen_saver_grace_period > 5
      ansible.builtin.debug:
        msg: "Warning!! Invalid time set for win19cis_screen_saver_grace_period. Review the notes for compliance."

    - name: "18.5.9 | AUDIT | Ensure MSS ScreenSaverGracePeriod The time in seconds before the screen saver grace period expires is set to Enabled 5 or fewer seconds | Set warn control ID for non-compliance"
      when: win19cis_screen_saver_grace_period > 5
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.5.9'

