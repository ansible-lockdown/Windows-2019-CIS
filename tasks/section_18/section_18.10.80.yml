---

- name: "18.10.80.1 | PATCH | Ensure Allow suggested apps in Windows Ink Workspace is set to Disabled"
  when: win19cis_rule_18_10_80_1
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.80.1
    - patch
    - wik
    - NIST800-171_3.14.6
    - NIST800-171_3.14.7
    - NIST800-53R5_SI-4
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace
    name: AllowSuggestedAppsInWindowsInkWorkspace
    data: 0
    type: dword

- name: "18.10.80.2 | PATCH | Ensure Allow Windows Ink Workspace is set to Enabled On, but disallow access above lock OR Enabled Disabled"
  when: win19cis_rule_18_10_80_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.80.2
    - automated
    - patch
    - NIST800-171_3.14.6
    - NIST800-171_3.14.7
    - NIST800-53R5_SI-4
  block:
    - name: "18.10.80.2 | PATCH | Ensure Allow Windows Ink Workspace is set to Enabled On, but disallow access above lock OR Enabled Disabled | Set Variable"
      when: win19cis_allow_windows_ink_workspace == 0 or win19cis_allow_windows_ink_workspace == 1
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace
        name: AllowWindowsInkWorkspace
        data: "{{ win19cis_allow_windows_ink_workspace }}"
        type: dword

    - name: "18.10.80.2 | AUDIT | Ensure Allow Windows Ink Workspace is set to Enabled On, but disallow access above lock OR Enabled Disabled | Warning Check For Variable Standards"
      when:
        - win19cis_allow_windows_ink_workspace != 0
        - win19cis_allow_windows_ink_workspace != 1
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid setting for win19cis_allow_windows_ink_workspace. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "18.10.80.2 | AUDIT | Ensure Allow Windows Ink Workspace is set to Enabled On, but disallow access above lock OR Enabled Disabled | Log a warning"
      when:
        - win19cis_allow_windows_ink_workspace != 0
        - win19cis_allow_windows_ink_workspace != 1
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.10.80.2'
