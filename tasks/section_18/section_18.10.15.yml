---

- name: "18.10.15.1 | PATCH | Ensure Do not display the password reveal button is set to Enabled"
  when: win19cis_rule_18_10_15_1
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.15.1
    - patch
    - gui
    - NIST800-171_3.5.2
    - NIST800-53R5_IA-5_1
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Credui
    name: DisablePasswordReveal
    data: 1
    type: dword

- name: "18.10.15.2 | PATCH | Ensure Enumerate administrator accounts on elevation is set to Disabled"
  when: win19cis_rule_18_10_15_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.15.2
    - patch
    - accounts
    - NIST800-171_3.1.7
    - NIST800-53R5_AC-6_10
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI
    name: EnumerateAdministrators
    data: 0
    type: dword
