---

- name: "18.10.37.1 | PATCH | Ensure Turn off location is set to Enabled"
  when: win19cis_rule_18_10_37_1
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.37.1
    - patch
    - location
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Locationandsensors
    name: DisableLocation
    data: 1
    type: dword
