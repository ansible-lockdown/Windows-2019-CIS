---

- name: "18.10.26.1.1 | PATCH | Ensure Application Control Event Log behavior when the log file reaches its maximum size is set to Disabled"
  when: win19cis_rule_18_10_26_1_1
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.26.1.1
    - patch
    - eventlog
    - NIST800-53R5_AU-4
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application
    name: Retention
    data: 0
    type: string

- name: "18.10.26.1.2 | PATCH | Ensure Application Specify the maximum log file size KB is set to Enabled 32768 or greater"
  when: win19cis_rule_18_10_26_1_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.26.1.2
    - patch
    - eventlog
    - NIST800-53R5_AU-4
  block:
    - name: "18.10.26.1.2 | PATCH | Ensure Application Specify the maximum log file size KB is set to Enabled 32768 or greater | Set File Size"
      when: win19cis_application_max_log_file_size >= 32768
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Eventlog\Application
        name: MaxSize
        data: "{{ win19cis_application_max_log_file_size }}"
        type: dword

    - name: "18.10.26.1.2 | AUDIT | Ensure Application Specify the maximum log file size KB is set to Enabled 32768 or greater | Warning Check For Variable Standards"
      when: win19cis_application_max_log_file_size < 32768
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid file size set for win19cis_application_max_log_file_size. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "18.10.26.1.2 | AUDIT | Ensure Application Specify the maximum log file size KB is set to Enabled 32768 or greater | Log a warning"
      when: win19cis_application_max_log_file_size < 32768
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.10.26.1.2'

