- name: "18.6.4.1 | PATCH | Ensure Configure multicast DNS (mDNS) protocol is set to Disabled"
  when: win19cis_rule_18_6_4_1
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.6.4.1
    - automated
    - patch
    - dns_over_https
    - NIST800-171_3.1.13
    - NIST800-171_3.5.2
    - NIST800-171_3.3.18
    - NIST800-53R5_AC-17_2
    - NIST800-53R5_IA-5
    - NIST800-53R5_IA-5_1
    - NIST800-53R5_SC-8
    - NIST800-53R5_SC-8_1
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient
    name: EnableMDNS
    data: 0
    type: dword

- name: "18.6.4.2 | PATCH | Ensure 'Configure NetBIOS settings' is set to 'Enabled: Disable NetBIOS name resolution on public networks'"
  when: win19cis_rule_18_6_4_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.6.4.2
    - automated
    - patch
    - netbios
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  block:
    - name: "18.6.4.2 | PATCH | Ensure 'Configure NetBIOS settings' is set to 'Enabled: Disable NetBIOS name resolution on public networks' | Set Variable"
      when: win19cis_enable_netbios_policy == 2 or win19cis_enable_netbios_policy == 0
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient
        name: EnableNetbios
        data: "{{ win19cis_enable_netbios_policy }}"
        type: dword

    - name: "18.6.4.2 | AUDIT | Ensure 'Configure NetBIOS settings' is set to 'Enabled: Disable NetBIOS name resolution on public networks' | Warning Check For Variable Standards"
      when:
        - win19cis_enable_netbios_policy != 2
        - win19cis_enable_netbios_policy != 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid setting for win19cis_enable_netbios_policy. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "18.6.4.2 | AUDIT | Ensure 'Configure NetBIOS settings' is set to 'Enabled: Disable NetBIOS name resolution on public networks' | Warn Count"
      when:
        - win19cis_enable_netbios_policy != 2
        - win19cis_enable_netbios_policy != 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.6.4.2'

